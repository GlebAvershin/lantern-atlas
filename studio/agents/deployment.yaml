apiVersion: apps/v1
kind: Deployment
metadata:
  name: game-review
spec:
  replicas: 2
  selector:
    matchLabels:
      app: game-review
  template:
    metadata:
      labels:
        app: game-review
    spec:
      automountServiceAccountToken: false
      containers:
        - name: gateway
          image: studio-review:ci
          imagePullPolicy: Never
          envFrom:
            - secretRef:
                name: review-config
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            periodSeconds: 2
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
