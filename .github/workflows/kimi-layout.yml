name: Four-game Kimi layout benchmark
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/kimi-layout.yml', 'studio/hud/kimi-ci.sh']
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: GlebAvershin/blackout-freight
          ref: 01f7611b325555f936c97914d414cf95801efbfb
          path: games/freight
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /studio
            /src/client
            /assets/airlock-receiver/receiver.png
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: GlebAvershin/mosaic-pier
          ref: b55fbfd61d934614eac4d75c225de3567fe98d9a
          path: games/mosaic
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /studio
            /web/index.html
            /web/assets/kingfisher.jpg
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: GlebAvershin/Soccerpoly
          ref: 3e3e9104561f4c6109b2d59ca6c505687d775765
          path: games/soccer
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /studio
            /src/client/Table.client.luau
            /art/stadium-preview.png
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: bash studio/hud/kimi-ci.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: four-game-kimi
          path: ${{ runner.temp }}/game-benchmark
          if-no-files-found: error
