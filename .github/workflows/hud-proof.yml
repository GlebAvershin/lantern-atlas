name: Responsive HUD handoff
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - studio/hud-brief.json
      - studio/hud-evaluation.json
      - .github/workflows/hud-proof.yml
      - game/art/northwatch.jpg
      - game/atlas.gd
      - studio/hud/**
      - .github/actions/author-hud/**
      - studio/agents/*signals.py
      - studio/agents/signal_context.py
  pull_request:
    paths:
      - studio/hud-brief.json
      - studio/hud-evaluation.json
      - .github/workflows/hud-proof.yml
      - game/art/northwatch.jpg
      - game/atlas.gd
      - studio/hud/**
      - .github/actions/author-hud/**
      - studio/agents/*signals.py
      - studio/agents/signal_context.py
permissions:
  contents: read
jobs:
  handoff:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: ./.github/actions/author-hud
